<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Section box — action patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#16181D; --text:#1B1E25; --text2:#5A6373; --text3:#8A93A3;
    --paper:#FBFAF6; --surface:#FFFFFF; --line:#E5E7EB;
    --teal:#0F7A8B; --teal-ink:#0B5D6B; --teal-wash:#E6F3F5;
    --coral:#E05A3C; --coral-ink:#B23A22; --coral-wash:#FCEAE4;
    --sand:#EAE1D2; --sand-hover:#E3D9C6; --sand-border:#DDD2BF; --sand-ink:#2A2620;
    --sans:"IBM Plex Sans",system-ui,sans-serif; --disp:"Manrope",sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#EFEDE6;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:30px 24px 80px;}
  h1{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 4px;color:var(--ink);}
  .sub{font-size:13px;color:var(--text3);margin-bottom:18px;}

  /* variant switch */
  .seg{display:inline-flex;padding:4px;border-radius:11px;background:#fff;border:1px solid var(--line);gap:2px;margin-bottom:6px;}
  .seg button{border:none;background:transparent;font-family:var(--sans);font-weight:600;font-size:13px;color:var(--text2);padding:8px 14px;border-radius:8px;cursor:pointer;}
  .seg button.on{background:var(--teal);color:#fff;}
  .hint{font-size:12.5px;color:var(--text2);margin:10px 0 16px;min-height:18px;}
  .hint b{color:var(--teal-ink);}

  /* the canvas that mimics the real project page section area */
  .canvas{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 20px 24px;}
  .seclabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .managebtn{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--text2);font-family:var(--sans);font-weight:600;font-size:11.5px;padding:5px 11px;border-radius:8px;cursor:pointer;text-transform:none;letter-spacing:0;}
  .managebtn.on{background:var(--teal);border-color:var(--teal);color:#fff;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .tile{position:relative;background:var(--sand);border:1px solid var(--sand-border);border-radius:5px;min-height:92px;padding:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;
    transition:background .14s,box-shadow .14s,transform .14s,border-color .14s,opacity .18s;}
  .tile:hover{background:var(--sand-hover);box-shadow:0 6px 16px rgba(20,22,29,.12);transform:translateY(-1px);}
  .tile .tn{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--sand-ink);line-height:1.25;}
  .tile .ts{font-size:11px;color:#8A8270;margin-top:4px;}
  .tile.gone{opacity:0;pointer-events:none;transform:scale(.96);}
  .tile.new{background:#FDFBF7;border:1.5px dashed #C9BCA6;color:var(--coral-ink);}
  .tile.new .tn{color:#8A551A;}

  /* corner controls (hidden by default, shown per-mode on hover) */
  .ctl{position:absolute;top:7px;right:7px;display:none;align-items:center;gap:4px;}
  .cbtn{width:26px;height:26px;border:none;border-radius:7px;background:rgba(255,255,255,.85);backdrop-filter:blur(2px);
    display:grid;place-items:center;cursor:pointer;color:var(--sand-ink);box-shadow:0 1px 3px rgba(20,22,29,.18);}
  .cbtn:hover{background:#fff;}
  .cbtn.danger:hover{color:var(--coral);background:var(--coral-wash);}
  .cbtn svg{width:15px;height:15px;}
  .kebab{font-size:17px;line-height:1;font-weight:700;letter-spacing:1px;padding-bottom:8px;}
  /* reveal rules */
  body.mode-a .tile:not(.new):hover .ctl.kebab-c,
  body.mode-a .tile.menuopen .ctl.kebab-c{display:flex;}
  body.mode-b .tile:not(.new):hover .ctl.trash-c{display:flex;}

  /* A — popover menu */
  .menu{position:absolute;top:36px;right:8px;width:170px;background:#fff;border:1px solid var(--line);border-radius:11px;
    box-shadow:0 12px 30px rgba(20,22,29,.18);padding:6px;z-index:5;text-align:left;display:none;cursor:default;}
  .tile.menuopen .menu{display:block;}
  .mi{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;font-family:var(--sans);
    font-size:13px;color:var(--text);padding:8px 9px;border-radius:7px;cursor:pointer;text-align:left;}
  .mi:hover{background:#F3F4F6;}
  .mi.danger{color:var(--coral-ink);}
  .mi.danger:hover{background:var(--coral-wash);}
  .mi svg{width:15px;height:15px;flex-shrink:0;color:var(--text3);}
  .mi.danger svg{color:var(--coral);}
  .msep{height:1px;background:var(--line);margin:5px 4px;}

  /* C — manage mode */
  .check{position:absolute;top:8px;left:8px;width:19px;height:19px;border-radius:5px;border:2px solid var(--sand-border);
    background:#fff;display:none;place-items:center;}
  body.mode-c.managing .tile:not(.new) .check{display:grid;}
  body.mode-c.managing .tile:not(.new){cursor:pointer;}
  .tile.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-wash),0 6px 16px rgba(20,22,29,.12);}
  .tile.sel .check{background:var(--teal);border-color:var(--teal);}
  .tile.sel .check svg{width:12px;height:12px;color:#fff;}
  .bulkbar{display:none;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;background:#fff;font-size:13px;}
  body.mode-c.managing .bulkbar{display:flex;}
  .bulkbar .n{font-weight:700;color:var(--ink);}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text2);font-family:var(--sans);font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;}
  .btn.danger{background:var(--coral);border-color:var(--coral);color:#fff;}
  .btn.danger[disabled]{opacity:.5;cursor:default;}

  /* hidden / restore row (mirrors the real page) */
  .hiddenrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:22px;}
  .hiddenrow .lb{font-size:11px;color:var(--text3);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px dashed var(--sand-border);
    color:var(--text2);cursor:pointer;font-size:11.5px;background:#fff;}
  .chip:hover{border-color:var(--teal);color:var(--teal-ink);background:var(--teal-wash);}
  .chip svg{width:12px;height:12px;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;font-size:13px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:14px;
    box-shadow:0 10px 30px rgba(20,22,29,.3);transition:opacity .18s,transform .18s;z-index:20;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast button{background:transparent;border:none;color:#7FD8E4;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--sans);}
</style>
</head>
<body class="mode-a">
<div class="wrap">
  <h1>Section box — action patterns</h1>
  <div class="sub">Just the section tiles. Pick the interaction that feels right; we build the winner into the real project page.</div>

  <div class="seg">
    <button id="tab-a" class="on" onclick="B.setMode('a')">⋯ Menu</button>
    <button id="tab-b" onclick="B.setMode('b')">Click‑to‑edit + delete</button>
    <button id="tab-c" onclick="B.setMode('c')">Manage mode</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="canvas">
    <div class="seclabel">Sections
      <button class="managebtn" id="managebtn" onclick="B.toggleManage()" style="display:none">Manage sections</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="bulkbar">
      <span><span class="n" id="selcount">0</span> selected</span>
      <button class="btn danger" id="delsel" onclick="B.deleteSelected()" disabled>Delete selected</button>
      <button class="btn" onclick="B.toggleManage()">Done</button>
    </div>
    <div class="hiddenrow" id="hiddenrow"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastmsg"></span><button id="toastact" onclick="B.undo()">Undo</button></div>

<script>
  const ICON = {
    open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M6 6v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6"/><path d="M10 11v6M14 11v6"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>',
  };
  const HINTS = {
    a:'<b>Hover</b> a tile → the <b>⋯</b> appears top‑right → <b>Open · Edit fields · Delete</b>. Body click = Open. Delete is soft (Undo).',
    b:'<b>Click the tile</b> = Edit fields. <b>Hover</b> → a trash icon top‑right deletes it (soft, with Undo).',
    c:'Toggle <b>Manage sections</b>, tick the ones a project doesn’t need, <b>Delete selected</b> in one go.',
  };
  const seed = [
    { id:1, name:'Insect Culture Maintenance', sub:'1 record' },
    { id:2, name:'Bioproduct Preparation', sub:'No records yet' },
    { id:3, name:'Pest Mortality Assessment', sub:'No records yet' },
    { id:4, name:'Dose–Response Evaluation', sub:'No records yet' },
    { id:5, name:'Non‑Target Effects', sub:'No records yet' },
  ];
  let sections = seed.map(s => ({ ...s }));
  let mode = 'a', managing = false, openMenu = null;
  const hidden = {};                 // id -> true
  const selected = new Set();
  let lastHidden = [];               // for Undo
  let toastTimer = null;

  const name = id => (sections.find(s => s.id === id) || {}).name || '';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  function tileHTML(s){
    const sel = selected.has(s.id) ? ' sel' : '';
    const menu = openMenu === s.id ? ' menuopen' : '';
    return `<div class="tile${sel}${menu}" data-id="${s.id}" onclick="B.tileClick(${s.id},event)">
      <span class="check">${ICON.check}</span>
      <div class="ctl kebab-c"><button class="cbtn kebab" title="Actions" onclick="B.kebab(${s.id},event)">⋯</button></div>
      <div class="ctl trash-c"><button class="cbtn danger" title="Delete section" onclick="B.del(${s.id},event)">${ICON.trash}</button></div>
      <div class="tn">${esc(s.name)}</div>
      <div class="ts">${esc(s.sub)}</div>
      <div class="menu" onclick="event.stopPropagation()">
        <button class="mi" onclick="B.menu(${s.id},'open',event)">${ICON.open} Open records</button>
        <button class="mi" onclick="B.menu(${s.id},'edit',event)">${ICON.edit} Edit fields</button>
        <div class="msep"></div>
        <button class="mi danger" onclick="B.menu(${s.id},'delete',event)">${ICON.trash} Delete section</button>
      </div>
    </div>`;
  }

  function render(){
    const grid = document.getElementById('grid');
    grid.innerHTML = sections.filter(s => !hidden[s.id]).map(tileHTML).join('') +
      `<div class="tile new" onclick="B.toast('New section →')"><div class="tn">+ New section</div></div>`;
    document.getElementById('managebtn').style.display = mode === 'c' ? 'inline-block' : 'none';
    document.getElementById('managebtn').classList.toggle('on', managing);
    const sc = document.getElementById('selcount'); if (sc) sc.textContent = selected.size;
    const ds = document.getElementById('delsel'); if (ds) ds.disabled = selected.size === 0;
    // hidden / restore chips
    const hids = sections.filter(s => hidden[s.id]);
    document.getElementById('hiddenrow').innerHTML = hids.length
      ? `<span class="lb">Hidden:</span>` + hids.map(s => `<span class="chip" onclick="B.restore(${s.id})">${ICON.undo}${esc(s.name)}</span>`).join('')
      : '';
    document.getElementById('hint').innerHTML = HINTS[mode];
  }

  function toast(msg, undo){
    document.getElementById('toastmsg').textContent = msg;
    document.getElementById('toastact').style.display = undo ? 'inline' : 'none';
    const t = document.getElementById('toast'); t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), undo ? 4200 : 1600);
  }
  function doHide(ids){
    lastHidden = ids.slice(); ids.forEach(id => { hidden[id] = true; });
    render();
    toast(ids.length === 1 ? `“${name(ids[0])}” hidden` : `${ids.length} sections hidden`, true);
  }

  window.B = {
    setMode(m){ mode = m; managing = false; openMenu = null; selected.clear();
      document.body.className = 'mode-' + m;
      ['a','b','c'].forEach(x => document.getElementById('tab-' + x).classList.toggle('on', x === m));
      render();
    },
    toggleManage(){ managing = !managing; document.body.classList.toggle('managing', managing); selected.clear(); render(); },
    tileClick(id, e){
      if (mode === 'c' && managing){ if (selected.has(id)) selected.delete(id); else selected.add(id); render(); return; }
      if (openMenu){ openMenu = null; render(); }
      if (mode === 'b'){ toast('Edit fields → ' + name(id)); return; }
      toast('Open → ' + name(id) + ' (Records)');
    },
    kebab(id, e){ e.stopPropagation(); openMenu = openMenu === id ? null : id; render(); },
    menu(id, action, e){ e.stopPropagation(); openMenu = null;
      if (action === 'delete'){ doHide([id]); return; }
      render(); toast((action === 'edit' ? 'Edit fields → ' : 'Open → ') + name(id));
    },
    del(id, e){ e.stopPropagation(); doHide([id]); },
    deleteSelected(){ if (!selected.size) return; const ids = [...selected]; selected.clear(); managing = false;
      document.body.classList.remove('managing'); doHide(ids); },
    restore(id){ delete hidden[id]; render(); },
    undo(){ lastHidden.forEach(id => { delete hidden[id]; }); lastHidden = []; render();
      document.getElementById('toast').classList.remove('on'); },
    toast(m){ toast(m); },
  };

  // close any open menu when clicking elsewhere
  document.addEventListener('click', e => { if (openMenu && !e.target.closest('.tile')){ openMenu = null; render(); } });
  B.setMode('a');
</script>
</body>
</html>
