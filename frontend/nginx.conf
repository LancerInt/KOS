# KOS frontend — production static serving + API/media proxy (PRD §33).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; never cache the shell or service worker.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;   # document uploads
    }
    location /media/ {
        proxy_pass http://backend:8000;
    }

    # SPA fallback — every other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
